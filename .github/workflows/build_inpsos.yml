name: Build inpsos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm gcc-multilib genisoimage make python3

      # Host-side tests run first: they need no emulator and fail fast.
      - name: Run host tests
        run: make test

      - name: Build ISO and image
        run: make -j"$(nproc)"

      - name: Upload built images
        uses: actions/upload-artifact@v4
        with:
          name: inpsos-builds
          path: |
            inpsos.iso
            inpsos.img
